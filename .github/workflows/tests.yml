name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install package
        run: python -m pip install . ./examples/text-plugin ./packages/hidden-moves-openai
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check installed provider integration
        run: python -m unittest discover -s examples/text-plugin/tests -v
      - name: Check function-tool export and dispatch
        run: python -m unittest discover -s packages/hidden-moves-openai/tests -v
      - name: Check installed commands
        run: |
          hidden-moves --plugin example-text moves show example.text.repeat
          hm --plugin example-text moves call example.text.repeat --arguments '{"value": "hello"}'
          python -m hidden_moves moves list

  mcp-adapter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host and optional adapter
        run: python -m pip install . ./examples/text-plugin ./packages/hidden-moves-mcp ./packages/hidden-moves-openai
      - name: Exercise MCP clients and local transport
        run: python -m unittest discover -s packages/hidden-moves-mcp/tests -v
      - name: Check interoperability demonstration
        run: python -m unittest discover -s examples/tests -v
