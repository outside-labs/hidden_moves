name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels from source distributions
        run: |
          python -m pip install uv
          uv build --out-dir dist
          uv build ./examples/text-plugin --out-dir dist
          uv build ./packages/hidden-moves-mcp --out-dir dist
          uv build ./packages/hidden-moves-openai --out-dir dist
          uv build ./packages/hidden-moves-github-projects --out-dir dist
      - name: Inspect and install actual wheels
        run: |
          python scripts/check_distributions.py dist
          python -c "import pathlib, subprocess, sys; wheels = sorted(str(p) for p in pathlib.Path('dist').glob('*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', *wheels], check=True)"
          python scripts/check_distributions.py dist --installed
      - name: Run core behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check installed provider integration
        run: python -m unittest discover -s examples/text-plugin/tests -v
      - name: Check function-tool export and dispatch
        run: python -m unittest discover -s packages/hidden-moves-openai/tests -v
      - name: Check standalone Projects client
        run: python -m unittest discover -s packages/hidden-moves-github-projects/tests -v
      - name: Check bounded Project writes with synthetic transport
        run: python -m unittest discover -s packages/hidden-moves-github-projects/write_tests -v
      - name: Exercise MCP clients and local transport
        run: python -m unittest discover -s packages/hidden-moves-mcp/tests -v
      - name: Check interoperability demonstration
        run: python -m unittest discover -s examples/tests -v
      - name: Demonstrate Projects fixture interoperability
        run: python examples/projects_fixture_demo.py

      - name: Checkout tested Backpack storage
        uses: actions/checkout@v4
        with:
          repository: outside-labs/backpack
          ref: 50bb74578a3686751bafcac9d6c9bdf12acdabe9
          path: .dependencies/backpack
      - name: Build and install the optional Backpack wheel
        run: |
          uv build .dependencies/backpack --out-dir backpack-dist
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('backpack-dist').glob('*.whl')); assert len(wheels) == 1; subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheels[0])], check=True)"
      - name: Verify typed Projects snapshots
        run: |
          python -m unittest discover -s packages/hidden-moves-github-projects/snapshot_tests -v
          python examples/projects_snapshot_demo.py
