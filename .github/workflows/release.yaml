name: Publish Hidden Moves to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: hidden-moves-pypi-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify core distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'hidden-moves'
          assert os.environ['RELEASE_TAG'] == 'v' + project['version'], 'Tag must match the package version'
          PY
      - name: Install build tools
        run: python -m pip install 'uv==0.12.19' twine
      - name: Build core wheel and source distribution
        run: uv build --out-dir dist
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify installed core and CLI aliases
        shell: bash
        run: |
          test_venv="${RUNNER_TEMP}/hidden-moves-wheel"
          uv venv "$test_venv" --python 3.13
          uv pip install --python "$test_venv/bin/python" dist/*.whl
          uv pip check --python "$test_venv/bin/python"
          "$test_venv/bin/python" -m unittest discover -s tests -v
          "$test_venv/bin/hidden-moves" --help
          "$test_venv/bin/hm" moves list --json
          "$test_venv/bin/python" -I -m hidden_moves moves list --json
      - uses: actions/upload-artifact@v5
        with:
          name: hidden-moves-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish core distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hidden-moves/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: hidden-moves-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
