[project]
name = "hidden-moves-example-text"
version = "0.1.0"
description = "An independently usable text capability and optional registry integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
integration = ["hidden-moves>=0.1,<0.2"]

[project.entry-points."hidden_moves.moves"]
example-text = "hidden_moves_example_text.integration:provide_moves"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
