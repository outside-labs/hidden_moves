[project]
name = "hidden-moves-github-projects"
version = "0.1.0"
description = "Read GitHub Projects through typed Python operations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ella Inng" }]
maintainers = [{ name = "Outside Labs" }]
keywords = ["github", "projects", "graphql", "capabilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
moves = ["hidden-moves>=0.1,<0.2"]
host = ["hidden-moves-mcp>=0.1,<0.2"]
backpack = ["outside-labs-backpack>=0.1,<0.2"]

[project.entry-points."hidden_moves.moves"]
github-projects = "hidden_moves_github_projects.integration:provide_moves"

[project.scripts]
hidden-moves-github-projects = "hidden_moves_github_projects.host:main"

[project.urls]
Homepage = "https://github.com/outside-labs/hidden_moves"
Source = "https://github.com/outside-labs/hidden_moves"
Issues = "https://github.com/outside-labs/hidden_moves/issues"
Documentation = "https://github.com/outside-labs/hidden_moves/blob/main/packages/hidden-moves-github-projects/README.md"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
