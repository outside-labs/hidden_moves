[project]
name = "hidden-moves-workspace"
version = "0.1.0"
description = "Bounded typed context over explicitly selected local text files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ella Inng" }]
maintainers = [{ name = "Outside Labs" }]
keywords = ["workspace", "context", "capabilities", "plugins", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
moves = ["hidden-moves>=0.1,<0.2"]
host = ["hidden-moves-mcp>=0.1,<0.2"]

[project.entry-points."hidden_moves.moves"]
workspace = "hidden_moves_workspace.integration:provide_moves"

[project.scripts]
hidden-moves-workspace = "hidden_moves_workspace.host:main"

[project.urls]
Homepage = "https://github.com/outside-labs/hidden_moves"
Source = "https://github.com/outside-labs/hidden_moves"
Issues = "https://github.com/outside-labs/hidden_moves/issues"
Documentation = "https://github.com/outside-labs/hidden_moves/blob/main/packages/hidden-moves-workspace/README.md"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
